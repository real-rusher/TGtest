[project]
name = "orchestrator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "botdb",
    "aiohttp>=3.9,<4",
    "openai>=1.40,<4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestrator", "orchestrator.payments"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
