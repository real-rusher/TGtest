name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          pip install -r telegram-gateway/requirements.txt
          pip install -e "db_layer[test]" -e "orchestrator[test]"
      - name: Telegram-Gateway
        run: python -m unittest discover -s telegram-gateway/tests -v
      - name: Datenbankschicht
        run: pytest db_layer
      - name: Orchestrator
        run: pytest orchestrator
